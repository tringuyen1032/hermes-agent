    help: "/topic — bật chế độ nhắn tin riêng nhiều phiên (một bot, nhiều cuộc trò chuyện song song)\n\nCách dùng:\n  /topic             Bật chế độ chủ đề hoặc xem trạng thái nếu đã bật\n  /topic help        Hiện thông tin trợ giúp này\n  /topic off         Tắt chế độ chủ đề và xóa liên kết với các chủ đề\n  /topic <id>        Trong một chủ đề: khôi phục phiên trước bằng ID\n\nCách hoạt động:\n1. Chạy /topic một lần trong cuộc trò chuyện riêng này — Hermes kiểm tra cài đặt Threads\n   của BotFather đã bật chưa rồi bật chế độ nhiều phiên.\n2. Chạm vào Tất cả tin nhắn ở đầu bot rồi gửi bất kỳ tin nhắn nào.\n   Telegram sẽ tạo chủ đề mới cho tin nhắn đó; mỗi chủ đề là một phiên Hermes\n   độc lập (lịch sử mới, ngữ cảnh mới).\n3. Cuộc trò chuyện riêng chính trở thành sảnh hệ thống — gửi /topic, /status,\n   /help, /usage tại đó. Gửi prompt thông thường trong một chủ đề.\n4. /new trong một chủ đề chỉ đặt lại phiên của chủ đề đó.\n5. /topic <id> trong một chủ đề sẽ khôi phục phiên cũ vào đó."
