    fallback_prior_turn_content: "lượt này không tạo nội dung mới; đang hiển thị ngữ cảnh trước đó đã khôi phục. Gửi `continue` để thử lại."
    redirect_restart_limit_exceeded: "yêu cầu bị hủy ở mỗi lần thử vì có chỉnh sửa mới, nên lượt này đã dừng thay vì thử lại liên tục. Chỉnh sửa gần nhất sẽ được gửi dưới dạng tin nhắn tiếp theo."
    rebuilt_restart_limit_exceeded: "mọi nhà cung cấp trong chuỗi dự phòng đều liên tục gặp lỗi, nên lượt này đã dừng thay vì thử lại liên tục. Gửi `continue` hoặc đổi nhà cung cấp."
    budget_exhausted: "đã dùng hết ngân sách số lần lặp/chi phí cho mỗi lượt trước khi có câu trả lời cuối cùng. Gửi `continue` để tiếp tục."
    ollama_runtime_context_too_small: "cửa sổ ngữ cảnh của mô hình cục bộ quá nhỏ để hoàn thành. Hãy tăng kích thước ngữ cảnh hoặc dùng mô hình lớn hơn."
    pending_tool_result: "lượt này đã dừng khi kết quả công cụ vẫn đang chờ và mô hình không tạo thêm nội dung. Gửi `continue` để mô hình tóm tắt."
    interrupted_during_api_call: "yêu cầu bị gián đoạn giữa chừng trước khi nhận được phản hồi. Gửi `continue` để thử lại."
    max_iterations_reached: "đã đạt giới hạn số lần lặp công cụ trước khi có câu trả lời cuối cùng. Gửi `continue` để tiếp tục hoặc tăng `max_iterations`."
    error_near_max_iterations: "đã xảy ra lỗi gần giới hạn số lần lặp trước khi có câu trả lời cuối cùng. Kiểm tra kết quả công cụ ở trên rồi gửi `continue`."
    repeated_outer_errors: "lượt này liên tục gặp lỗi nên đã dừng sớm thay vì thử lại liên tục. Kiểm tra các lỗi ở trên rồi gửi `continue` để thử lại."
  persistence:
    compression: "lượt này đã dừng vì một tiến trình khác đang nén phiên. Tin nhắn của bạn có thể đã được lưu — hãy gửi lại sau khi nén xong."
    compression_closed: "lượt này đã dừng vì phiên được xoay vòng khi nén ngữ cảnh và không thể tiếp tục phiên đang chạy. Bộ nhớ vẫn hoạt động bình thường — hãy làm mới ứng dụng (hoặc bắt đầu lượt mới) để ứng dụng nhận session id mới, rồi gửi lại tin nhắn."
    turn_lease: "lượt này đã dừng vì một tiến trình Hermes khác tiếp quản phiên. Phản hồi của bạn chưa được lưu — hãy đợi tiến trình kia hoàn tất rồi gửi lại tin nhắn."
    session_row_missing: "phiên này đã bị xóa khỏi bộ nhớ khi cuộc trò chuyện vẫn đang mở và Hermes không thể tạo lại, nên tin nhắn chưa được lưu. Hãy gửi lại tin nhắn; nếu vẫn gặp lỗi, chạy `hermes {profile_arg}doctor`."
    locked: "lượt này đã dừng vì bộ nhớ phiên đang bận (một tiến trình Hermes khác đang ghi vào cơ sở dữ liệu trạng thái). Tin nhắn của bạn có thể đã được lưu — hãy gửi lại sau ít phút."
    replaced: "tệp cơ sở dữ liệu phiên đã bị thay thế khi Hermes đang chạy, nên tin nhắn này chưa được lưu (bản sao được giữ trong {home}/sessions/). Dừng Hermes (`hermes {profile_arg}gateway stop`), chạy `hermes {profile_arg}doctor` — không chạy `hermes {profile_arg}doctor --fix`, vì lệnh này sẽ sửa nhầm tệp ngay tại chỗ — sau đó khởi động lại Hermes và gửi lại tin nhắn. Xem nhật ký để biết các bước khôi phục nâng cao."
    deleted_wal: "một tiến trình Hermes khác vẫn đang giữ bản cũ của nhật ký ghi trước (WAL) trong cơ sở dữ liệu phiên. Hermes đã ngừng ghi để bảo vệ tệp, nên tin nhắn này chưa được lưu (bản sao được giữ trong {home}/sessions/). Không có dữ liệu nào bị mất. Thoát mọi tiến trình Hermes trên hồ sơ này (ứng dụng Desktop, `hermes {profile_arg}gateway stop`, bảng điều khiển, tác vụ định kỳ), chạy `hermes {profile_arg}doctor` — lệnh này sẽ cho biết tiến trình nào vẫn đang giữ nhật ký — rồi khởi động lại Hermes và gửi lại tin nhắn. Không chạy `doctor --fix` hoặc xóa bất kỳ tệp state.db nào khi các tiến trình đó còn chạy. Hướng dẫn: {recovery_docs}"
    corrupt: "lượt xử lý đã dừng vì cơ sở dữ liệu trạng thái báo lỗi hỏng cấu trúc (bản ghi cuộc trò chuyện sẽ bị mất khi khởi động lại). Giải phóng dung lượng ổ đĩa sẽ không giúp ích. Các cách khôi phục:\n1. Chạy `hermes {profile_arg}doctor --fix`\n2. Dừng gateway, rồi khôi phục bằng:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (nếu báo có thể khôi phục) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — trước tiên, quá trình khôi phục sẽ tạo bản sao lưu của tệp bị hỏng; KHÔNG chạy `sqlite3 ... \".recover\"` trên state.db đang hoạt động vì phiên bản sqlite3 CLI dễ gặp lỗi có thể làm hỏng tệp nặng hơn\n3. Khôi phục từ bản sao lưu trong {backups_dir}/\nSau đó gửi lại tin nhắn."
    fts_index: "lượt xử lý đã dừng vì chỉ mục tìm kiếm phiên (FTS5) bị hỏng và không thể tách ra, nên tin nhắn này chưa được lưu. Kho tin nhắn không bị hỏng: không chạy công cụ khôi phục hoặc khôi phục từ bản sao lưu. Chạy `hermes {profile_arg}doctor --fix` (hoặc khởi động lại Hermes để sửa chỉ mục khi mở), rồi gửi lại tin nhắn."
    disk: "Hermes không thể lưu cuộc trò chuyện này vào đĩa, nên đã dừng để tránh làm mất tin nhắn. Có thể đĩa đã đầy: hãy giải phóng dung lượng (hoặc sửa quyền truy cập của {home}/state.db), rồi gửi lại tin nhắn."
    default: "Hermes không thể lưu cuộc trò chuyện này, nên đã dừng để tránh làm mất tin nhắn. Có thể ổ đĩa đã đầy hoặc một tiến trình Hermes khác đang giữ cơ sở dữ liệu. Đóng các cửa sổ Hermes khác, chạy `hermes {profile_arg}doctor` để kiểm tra dung lượng lưu trữ, rồi gửi lại tin nhắn."
  file_mutation:
    header: "⚠️ Trình xác minh thay đổi tệp: {count} lần chỉnh sửa tệp đã THẤT BẠI trong lượt này, bất kể nội dung phía trên có thể khiến bạn nghĩ ngược lại. Chạy `git status` hoặc `read_file` để xác nhận thay đổi nào thực sự được áp dụng."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "thất bại"
  shared:
    and_more: "  • … và {count} mục khác"
    the_model: "Mô hình"
tips:
  t001: "/bg <prompt> chạy tác vụ trong một phiên riêng, để phiên hiện tại vẫn sẵn sàng; /btw <question> trả lời câu hỏi bên lề về cuộc trò chuyện này mà không làm gián đoạn phiên."
  t002: "/branch tạo nhánh từ phiên hiện tại để bạn thử hướng đi khác mà không mất tiến độ."
  t003: "/compress nén ngữ cảnh cuộc trò chuyện theo cách thủ công khi nội dung bắt đầu dài."
  t004: "/rollback liệt kê các điểm khôi phục hệ thống tệp — khôi phục tệp agent đã sửa về bất kỳ trạng thái trước đó nào."
  t005: "/rollback diff 2 xem trước những thay đổi kể từ điểm khôi phục 2 mà không khôi phục gì."
  t006: "/rollback 2 src/file.py khôi phục một tệp từ điểm khôi phục cụ thể."
  t007: "/title \"my project\" đặt tên cho phiên — tiếp tục phiên sau bằng /resume hoặc hermes -c."
  t008: "/resume tiếp tục phiên đã đặt tên trước đó từ chỗ bạn dừng lại."
  t009: "/queue <prompt> xếp tin nhắn vào hàng đợi để xử lý ở lượt tiếp theo mà không làm gián đoạn lượt hiện tại."
  t010: "/undo xóa trao đổi gần nhất giữa bạn và trợ lý khỏi cuộc trò chuyện."
  t011: "/retry gửi lại tin nhắn gần nhất — hữu ích khi phản hồi của agent chưa đúng ý."
  t012: "/verbose chuyển đổi cách hiển thị tiến độ công cụ: tắt → mới → tất cả → chi tiết."
  t013: "/reasoning high tăng độ sâu suy luận của mô hình. /reasoning show hiển thị phần suy luận."
  t014: "/fast bật/tắt chế độ xử lý ưu tiên để API phản hồi nhanh hơn (tùy nhà cung cấp)."
  t015: "/yolo bỏ qua mọi yêu cầu phê duyệt lệnh nguy hiểm trong phần còn lại của phiên."
  t016: "/model cho phép đổi mô hình giữa phiên — thử /model sonnet hoặc /model gpt-5."
  t017: "/model --global đổi vĩnh viễn mô hình mặc định."
  t018: "/personality pirate tạo tính cách vui nhộn — có sẵn 14 lựa chọn, từ kawaii đến shakespeare."
  t019: "/skin đổi chủ đề CLI — thử ares, mono, slate, poseidon hoặc charizard."
  t020: "/statusbar bật/tắt thanh cố định hiển thị mô hình, token, % ngữ cảnh đã dùng, chi phí và thời lượng."
  t021: "/tools disable browser tạm thời gỡ các công cụ browser khỏi phiên hiện tại."
  t022: "/browser connect kết nối công cụ browser với trình duyệt thuộc họ Chromium đang chạy qua CDP."
  t023: "/plugins liệt kê các plugin đã cài đặt và trạng thái của chúng."
  t024: "/cron quản lý tác vụ định kỳ — thiết lập prompt lặp lại và gửi đến bất kỳ nền tảng nào."
  t025: "/reload-mcp tải lại cấu hình máy chủ MCP mà không cần khởi động lại."
  t026: "/usage hiển thị mức sử dụng token, chi tiết chi phí và thời lượng phiên."
  t027: "/insights hiển thị thống kê sử dụng trong 30 ngày qua."
  t028: "/paste kiểm tra clipboard để tìm ảnh và đính kèm vào tin nhắn tiếp theo."
  t029: "/profile hiển thị hồ sơ đang hoạt động và thư mục home của hồ sơ đó."
  t030: "/config xem nhanh cấu hình hiện tại."
  t031: "/stop dừng mọi tiến trình nền do agent khởi chạy."
  t032: "@file:path/to/file.py chèn trực tiếp nội dung tệp vào tin nhắn."
  t033: "@file:main.py:10-50 chỉ chèn các dòng 10-50 của tệp."
  t034: "@folder:src/ chèn danh sách cây thư mục."
  t035: "@diff chèn các thay đổi Git chưa được stage vào tin nhắn."
  t036: "@staged chèn các thay đổi Git đã stage (git diff --staged)."
  t037: "@git:5 chèn 5 commit gần nhất kèm đầy đủ bản vá."
  t038: "@url:https://example.com tải và chèn nội dung trang web."
  t039: "Nhập @ để tự động hoàn thành đường dẫn tệp — tương tác chọn bất kỳ tệp nào."
  t040: "Kết hợp nhiều tham chiếu: “Review @file:main.py and @file:test.py for consistency.”"
  t041: "Alt+Enter chèn dòng mới khi nhập nhiều dòng. (Windows Terminal chặn Alt+Enter — hãy dùng Ctrl+Enter.)"
  t042: "Ctrl+C ngắt agent. Nhấn hai lần trong vòng 2 giây để buộc thoát."
  t043: "Ctrl+Z đưa Hermes về chạy nền — chạy fg trong shell để tiếp tục."
  t044: "Tab chấp nhận phần văn bản gợi ý hoặc tự động hoàn thành lệnh slash."
  t045: "Nhập tin nhắn mới khi agent đang chạy để ngắt và định hướng lại."
  t046: "Alt+V dán ảnh từ clipboard vào cuộc trò chuyện."
  t047: "Khi dán từ 5 dòng trở lên, nội dung sẽ tự lưu vào tệp và thay bằng tham chiếu gọn hơn."
  t048: "hermes -c tiếp tục phiên CLI gần nhất. hermes -c \"project name\" tiếp tục phiên theo tiêu đề."
  t049: "hermes -w tạo git worktree riêng — rất phù hợp để chạy nhiều agent song song."
  t050: "hermes -w -q \"Fix issue #42\" kết hợp worktree riêng với một truy vấn chạy một lần."
  t051: "hermes chat -t web,terminal chỉ bật những bộ công cụ cụ thể cho phiên tập trung."
  t052: "hermes chat -s github-pr-workflow tải sẵn một kỹ năng khi khởi chạy."
  t053: "hermes chat -q \"query\" chạy một truy vấn duy nhất không tương tác rồi thoát."
  t054: "hermes chat --max-turns 1000 tăng giới hạn mặc định từ 500 lên 1000 vòng lặp mỗi lượt."
  t055: "hermes chat --checkpoints tạo ảnh chụp hệ thống tệp trước mỗi lần thay đổi tệp có thể gây mất dữ liệu."
  t056: "hermes --yolo bỏ qua mọi yêu cầu phê duyệt lệnh nguy hiểm trong cả phiên."
  t057: "hermes chat --source telegram gắn nhãn phiên để lọc bằng hermes sessions list."
  t058: "hermes -p work chat chạy với hồ sơ cụ thể mà không thay đổi hồ sơ mặc định."
  t059: "hermes doctor --fix chẩn đoán và tự sửa lỗi cấu hình, lỗi phụ thuộc."
  t060: "hermes dump xuất bản tóm tắt cấu hình ngắn gọn — rất hữu ích khi báo lỗi."
  t061: "hermes config set KEY VALUE tự chuyển bí mật vào .env và các giá trị khác vào config.yaml."
  t062: "hermes config edit mở config.yaml bằng trình soạn thảo mặc định."
  t063: "hermes config check quét các tùy chọn cấu hình bị thiếu hoặc đã lỗi thời."
  t064: "hermes sessions browse mở trình chọn phiên tương tác có chức năng tìm kiếm."
  t065: "hermes sessions stats hiển thị số phiên theo nền tảng và dung lượng cơ sở dữ liệu."
  t066: "hermes sessions prune --older-than 30 dọn dẹp các phiên cũ."
  t067: "hermes skills search react --source skills-sh tìm kiếm thư mục công khai skills.sh."
  t068: "hermes skills check kiểm tra các kỹ năng hub đã cài đặt để tìm bản cập nhật từ nguồn."
  t069: "hermes skills tap add myorg/skills-repo thêm nguồn kỹ năng GitHub tùy chỉnh."
  t070: "hermes skills snapshot export setup.json xuất cấu hình kỹ năng để sao lưu hoặc chia sẻ."
  t071: "hermes mcp add github --command npx thêm máy chủ MCP từ dòng lệnh."
  t072: "hermes mcp serve chạy chính Hermes dưới dạng máy chủ MCP cho các agent khác."
  t073: "hermes auth add cho phép thêm nhiều khóa API để luân phiên sử dụng thông tin xác thực."
  t074: "hermes completion bash >> ~/.bashrc bật tính năng tự động hoàn thành bằng phím Tab cho mọi lệnh và hồ sơ."
  t075: "hermes logs -f theo dõi agent.log theo thời gian thực. --level WARNING --since 1h lọc kết quả."
  t076: "hermes backup tạo bản sao lưu ZIP cho toàn bộ thư mục home của Hermes."
  t077: "hermes profile create coder tạo hồ sơ riêng biệt, có thể dùng như một lệnh độc lập."
  t078: "hermes profile create work --clone sao chép cấu hình và khóa hiện tại sang hồ sơ mới."
  t079: "hermes update tự động đồng bộ các kỹ năng đi kèm mới sang TẤT CẢ hồ sơ."
  t080: "hermes gateway install thiết lập Hermes thành dịch vụ hệ thống (systemd/launchd)."
  t081: "hermes memory setup cho phép cấu hình nhà cung cấp bộ nhớ bên ngoài (Honcho, Mem0, v.v.)."
  t082: "hermes webhook subscribe tạo các tuyến webhook theo sự kiện, có xác thực HMAC."
  t083: "Tiết kiệm chi phí: hermes tools tắt các công cụ không dùng, còn hermes skills config tinh gọn danh sách kỹ năng."
  t084: "/reasoning low hoặc /reasoning minimal giảm độ sâu suy luận so với mặc định (medium) — phản hồi nhanh hơn, ít tốn kém hơn."
  t085: "hermes models chuyển các tác vụ thị giác, nén và phụ trợ sang mô hình rẻ hơn — giảm hơn 85% chi phí token chạy nền mà không hạ cấp mô hình trò chuyện chính."
  t086: "Đặt display.bell_on_complete: true trong config.yaml để nghe chuông khi tác vụ dài hoàn tất."
  t087: "Đặt display.streaming: true để xem token xuất hiện theo thời gian thực khi mô hình tạo phản hồi."
  t088: "Đặt display.show_reasoning: true để xem chuỗi suy luận của mô hình."
  t089: "Đặt display.compact: true để giảm khoảng trắng trong đầu ra, hiển thị thông tin cô đọng hơn."
  t090: "Đặt display.busy_input_mode: queue để xếp hàng tin nhắn thay vì ngắt agent, hoặc đặt thành steer để định hướng agent giữa lúc chạy qua /steer."
  t091: "Đặt display.resume_display: minimal để bỏ qua phần tóm tắt đầy đủ cuộc trò chuyện khi tiếp tục phiên."
  t092: "Đặt compression.threshold: 0.50 để kiểm soát thời điểm tự động nén ngữ cảnh (mặc định: 50% cửa sổ ngữ cảnh)."
  t093: "Đặt agent.max_turns: 1000 để agent có thể thực hiện nhiều bước gọi công cụ hơn trong mỗi lượt."
  t094: "Đặt file_read_max_chars: 200000 để tăng giới hạn nội dung mỗi lần gọi read_file."
  t095: "Đặt approvals.mode: smart để LLM tự động phê duyệt lệnh an toàn và từ chối lệnh nguy hiểm."
  t096: "Đặt fallback_model trong config.yaml để tự động chuyển sang nhà cung cấp dự phòng."
  t097: "Đặt privacy.redact_pii: true để băm ID người dùng và số điện thoại trước khi gửi đến LLM."
  t098: "Đặt browser.record_sessions: true để tự động ghi lại phiên duyệt web thành video WebM."
  t099: "Đặt worktree: true trong config.yaml để luôn tạo git worktree (tương đương hermes -w)."
  t100: "Đặt security.website_blocklist.enabled: true để chặn một số miền cụ thể khỏi các công cụ web."
  t101: "Đặt cron.wrap_response: false để gửi đầu ra nguyên bản từ agent, không kèm phần đầu và cuối của cron."
  t102: "HERMES_TIMEZONE ghi đè múi giờ máy chủ bằng bất kỳ chuỗi múi giờ IANA nào."
  t103: "Config.yaml hỗ trợ thay thế biến môi trường: dùng cú pháp ${VAR_NAME}."
  t104: "Lệnh nhanh trong config.yaml chạy lệnh shell tức thì mà không tốn token."
  t105: "Có thể định nghĩa tính cách tùy chỉnh trong config.yaml, tại agent.personalities."
  t106: "provider_routing kiểm soát cách sắp xếp, đưa vào danh sách cho phép và chặn nhà cung cấp trên OpenRouter."
  t107: "execute_code chạy script Python gọi các công cụ Hermes theo cách lập trình — kết quả không chiếm ngữ cảnh."
  t108: "theo mặc định, delegate_task tạo tối đa 10 agent con chạy đồng thời (delegation.max_concurrent_children), với ngữ cảnh riêng để xử lý công việc song song."
  t109: "web_extract xử lý được URL PDF — chỉ cần truyền liên kết PDF, công cụ sẽ chuyển nội dung thành Markdown."
  t110: "search_files dùng ripgrep nên nhanh hơn grep — hãy dùng thay cho grep trong terminal."
  t111: "patch dùng 9 chiến lược so khớp linh hoạt nên khác biệt nhỏ về khoảng trắng cũng không làm hỏng chỉnh sửa."
  t112: "patch hỗ trợ định dạng V4A để chỉnh sửa hàng loạt nhiều tệp trong một lần gọi."
  t113: "nếu không tìm thấy tệp, read_file sẽ gợi ý tên tệp tương tự."
  t114: "read_file tự loại bỏ nội dung trùng lặp — đọc lại tệp không thay đổi sẽ chỉ trả về phần tóm tắt gọn nhẹ."
  t115: "browser_vision chụp ảnh màn hình rồi phân tích bằng AI — dùng được với CAPTCHA và nội dung trực quan."
  t116: "browser_console có thể chạy biểu thức JavaScript trong ngữ cảnh trang."
  t117: "image_generate tạo ảnh bằng FLUX 2 Pro và tự động phóng to 2x."
  t118: "text_to_speech chuyển văn bản thành âm thanh — trên Telegram, âm thanh sẽ phát dưới dạng bong bóng giọng nói."
  t119: "send_message có thể gửi tin nhắn đến bất kỳ nền tảng nhắn tin nào đã kết nối trong phiên."
  t120: "Công cụ todo giúp agent theo dõi các tác vụ phức tạp gồm nhiều bước trong phiên."
  t121: "session_search tìm kiếm toàn văn trong TẤT CẢ cuộc trò chuyện trước đây."
  t122: "Agent tự động lưu tùy chọn, thông tin chỉnh sửa và thông tin về môi trường vào bộ nhớ."
  t123: "/moa chuyển một prompt khó qua bộ mô hình Mixture of Agents đã cấu hình."
  t124: "Lệnh terminal hỗ trợ chạy nền với notify_on_complete để thông báo khi tác vụ chạy lâu hoàn tất."
  t125: "Tiến trình chạy nền trong terminal hỗ trợ watch_patterns để cảnh báo khi xuất hiện những dòng đầu ra cụ thể."
  t126: "Công cụ terminal hỗ trợ 6 backend: cục bộ, Docker, SSH, Modal, Daytona và Singularity."
  t127: "Mỗi hồ sơ có cấu hình, khóa API, bộ nhớ, phiên, kỹ năng và tác vụ định kỳ riêng."
  t128: "Tên hồ sơ cũng là lệnh shell — 'hermes profile create coder' tạo lệnh 'coder'."
  t129: "hermes profile export coder -o backup.tar.gz tạo tệp lưu trữ hồ sơ có thể dùng ở nơi khác."
  t130: "Nếu hai hồ sơ vô tình dùng chung token bot, gateway thứ hai sẽ bị chặn và hiển thị lỗi rõ ràng."
  t131: "Phiên tự tạo tiêu đề mô tả sau lượt trao đổi đầu tiên — không cần đặt tên thủ công."
  t132: "Tiêu đề phiên hỗ trợ đánh số theo chuỗi: “my project” → “my project #2” → “my project #3”."
  t133: "Khi thoát, Hermes sẽ in lệnh tiếp tục phiên kèm ID phiên và số liệu thống kê."
  t134: "hermes sessions export backup.jsonl xuất tất cả phiên để sao lưu hoặc phân tích."
  t135: "hermes -r SESSION_ID tiếp tục bất kỳ phiên cũ nào bằng ID phiên."
  t136: "Bộ nhớ là ảnh chụp cố định — các thay đổi chỉ xuất hiện trong prompt hệ thống khi bắt đầu phiên tiếp theo."
  t137: "Các mục trong bộ nhớ tự động được quét để phát hiện prompt injection và mẫu đánh cắp dữ liệu."
  t138: "Agent có hai kho lưu trữ bộ nhớ: ghi chú cá nhân (~2200 ký tự) và hồ sơ người dùng (~1375 ký tự)."
  t139: "Những chỉnh sửa bạn góp ý cho agent (“không, hãy làm theo cách này”) thường được tự động lưu vào bộ nhớ."
  t140: "Có hơn 80 kỹ năng đi kèm, bao gồm github, sáng tạo, mlops, năng suất, nghiên cứu và nhiều lĩnh vực khác."
  t141: "Mỗi kỹ năng đã cài đặt tự động trở thành một lệnh slash — nhập / để xem tất cả."
  t142: "hermes skills install official/security/1password cài đặt các kỹ năng tùy chọn từ kho mã."
  t143: "Kỹ năng có thể giới hạn theo hệ điều hành — một số chỉ tải trên macOS hoặc Linux."
  t144: "skills.external_dirs trong config.yaml cho phép tải kỹ năng từ thư mục tùy chỉnh."
  t145: "Agent có thể tự tạo kỹ năng làm bộ nhớ quy trình bằng skill_manage."
  t146: "/plan ghi kế hoạch triển khai Markdown vào .hermes/plans/ mà không thực thi bất kỳ thao tác nào."
  t147: "Tác vụ định kỳ có thể đính kèm kỹ năng: hermes cron add --skill blogwatcher \"Check for new posts\"."
  t148: "Có thể gửi kết quả tác vụ định kỳ đến telegram, discord, slack, email, sms và hơn 12 nền tảng khác."
  t149: "Nếu phản hồi của tác vụ định kỳ bắt đầu bằng [SILENT], hệ thống sẽ không gửi kết quả — hữu ích cho các tác vụ chỉ giám sát."
  t150: "Cron hỗ trợ độ trễ tương đối (30m), khoảng thời gian (every 2h), biểu thức cron và dấu thời gian ISO."
  t151: "Tác vụ định kỳ chạy trong phiên agent hoàn toàn mới — prompt cần có đầy đủ thông tin."
  t152: "Chế độ giọng nói hoạt động mà không cần khóa API nếu đã cài faster-whisper (công cụ chuyển giọng nói thành văn bản miễn phí, chạy cục bộ)."
  t153: "Có 5 nhà cung cấp TTS: Edge TTS (miễn phí), ElevenLabs, OpenAI, NeuTTS (miễn phí, chạy cục bộ) và MiniMax."
  t154: "/voice on bật chế độ giọng nói trong CLI. Ctrl+B bật/tắt ghi âm nhấn để nói."
  t155: "TTS truyền phát phát từng câu ngay khi tạo xong — không cần chờ toàn bộ phản hồi."
  t156: "Tin nhắn thoại trên Telegram, Discord, WhatsApp và Slack được tự động chuyển thành văn bản."
  t157: "Hermes hoạt động trên 21 nền tảng nhắn tin: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, Email và nhiều nền tảng khác."
  t158: "hermes gateway install cài đặt gateway thành dịch vụ hệ thống tự khởi động cùng máy."
  t159: "DingTalk dùng Stream Mode — không cần webhook hay URL công khai."
  t160: "BlueBubbles kết nối iMessage với Hermes thông qua máy chủ macOS cục bộ."
  t161: "Các tuyến webhook hỗ trợ xác thực HMAC, giới hạn tốc độ và lọc sự kiện."
  t162: "Máy chủ API cung cấp endpoint tương thích với OpenAI, Open WebUI và LibreChat."
  t163: "Chế độ kênh thoại Discord: bot tham gia kênh thoại, chuyển lời nói thành văn bản rồi phản hồi bằng giọng nói."
  t164: "group_sessions_per_user: true tạo phiên riêng cho từng người trong cuộc trò chuyện nhóm."
  t165: "/sethome đánh dấu cuộc trò chuyện làm kênh nhận thông báo từ tác vụ định kỳ."
  t166: "Gateway hỗ trợ tự động hết thời gian chờ khi không hoạt động — agent đang hoạt động có thể chạy liên tục."
  t167: "Phê duyệt lệnh nguy hiểm có 4 mức: một lần, trong phiên, luôn luôn (danh sách cho phép vĩnh viễn) và từ chối."
  t168: "Chế độ phê duyệt thông minh dùng LLM để tự động phê duyệt lệnh an toàn và cảnh báo lệnh nguy hiểm."
  t169: "Bảo vệ SSRF chặn mạng riêng, địa chỉ loopback, link-local và địa chỉ metadata trên cloud."
  t170: "ID phiên có tiền tố thời gian (20250305_091523_abcd) để ls và jq tự sắp xếp theo thứ tự tự nhiên."
  t171: "Các tiến trình con MCP chỉ nhận những biến môi trường đã lọc — chỉ biến hệ thống an toàn mới được truyền qua."
  t172: "Các tệp ngữ cảnh (.hermes.md, AGENTS.md) được quét bảo mật để phát hiện prompt injection trước khi tải."
  t173: "command_allowlist trong config.yaml phê duyệt vĩnh viễn các mẫu lệnh shell cụ thể."
  t174: "Ngữ cảnh tự động được nén khi đạt ngưỡng — bộ nhớ được lưu lại và lịch sử được tóm tắt."
  t175: "Thanh trạng thái chuyển vàng, rồi cam, rồi đỏ khi ngữ cảnh dần đầy."
  t176: "SOUL.md là tệp định danh chính của agent — tùy chỉnh tệp này để định hình cách hoạt động."
  t177: "Hermes tải ngữ cảnh dự án từ .hermes.md, AGENTS.md, CLAUDE.md hoặc .cursorrules (tệp đầu tiên khớp)."
  t178: "Các tệp AGENTS.md trong thư mục con được phát hiện dần khi agent đi vào từng thư mục."
  t179: "Mỗi tệp ngữ cảnh có giới hạn 20.000 ký tự, được cắt thông minh ở phần đầu và cuối."
  t180: "Có 5 nhà cung cấp trình duyệt: Chromium cục bộ, Browserbase, Browser Use, Camofox và Firecrawl."
  t181: "Camofox là trình duyệt chống phát hiện — một nhánh Firefox dùng C++ để giả mạo dấu vân tay trình duyệt."
  t182: "browser_navigate tự động trả về ảnh chụp trang — không cần gọi browser_snapshot sau đó."
  t183: "browser_vision với annotate=true phủ nhãn đánh số lên các thành phần tương tác."
  t184: "hermes mcp mở danh sách tương tác các MCP được Nous phê duyệt để bạn cài đặt chỉ bằng một lần nhấn phím."
  t185: "hermes mcp catalog liệt kê các máy chủ MCP được Nous phê duyệt, đi kèm kho mã."
  t186: "hermes mcp install <name> cài mục trong danh mục, yêu cầu thông tin xác thực và cho phép chọn công cụ cần bật."
  t187: "Máy chủ MCP được cấu hình trong config.yaml — hỗ trợ cả phương thức truyền tải stdio và HTTP."
  t188: "Lọc công cụ theo từng máy chủ: tools.include tạo danh sách cho phép, còn tools.exclude tạo danh sách chặn."
  t189: "Máy chủ MCP tự tạo bộ công cụ khi chạy — hermes tools có thể bật/tắt chúng trên từng nền tảng."
  t190: "Hỗ trợ OAuth cho MCP: auth: oauth cho phép ủy quyền qua trình duyệt bằng PKCE."
  t191: "Checkpoint không tốn tài nguyên khi không có tệp nào bị chỉnh sửa — mặc định đã bật."
  t192: "Ảnh chụp trước khi khôi phục được tự động lưu để bạn có thể hoàn tác thao tác hoàn tác."
  t193: "/rollback cũng hoàn tác lượt trò chuyện, để agent không nhớ những thay đổi đã khôi phục."
  t194: "Checkpoint dùng repo shadow trong ~/.hermes/checkpoints/ — không bao giờ đụng đến .git của dự án."
  t195: "batch_runner.py xử lý hàng trăm prompt song song để tạo dữ liệu huấn luyện."
  t196: "hermes chat -Q bật chế độ yên lặng khi dùng bằng chương trình — ẩn banner và vòng tải."
  t197: "Lưu quỹ đạo (--save-trajectories) ghi lại toàn bộ dấu vết dùng công cụ để huấn luyện mô hình."
  t198: "Có ba loại plugin: plugin tổng quát (công cụ/hook), nhà cung cấp bộ nhớ và engine ngữ cảnh."
  t199: "hermes plugins install owner/repo cài plugin trực tiếp từ GitHub."
  t200: "Các nhà cung cấp bộ nhớ bên ngoài gồm Honcho, Hindsight, Mem0, OpenViking và nhiều lựa chọn khác, cài qua hermes plugins install."
  t201: "Hook của plugin gồm pre/post_tool_call, pre/post_llm_call và transform_terminal_output để chuẩn hóa đầu ra."
  t202: "Lưu bộ nhớ đệm prompt (Anthropic) giúp giảm chi phí bằng cách tái sử dụng tiền tố prompt hệ thống đã lưu."
  t203: "Agent tự tạo tiêu đề phiên trong một luồng nền — không ảnh hưởng đến độ trễ."
  t204: "Định tuyến mô hình thông minh có thể tự chuyển các truy vấn đơn giản sang mô hình rẻ hơn."
  t205: "Lệnh gạch chéo hỗ trợ khớp tiền tố: /h tương ứng với /help, /mod tương ứng với /model."
  t206: "Kéo đường dẫn tệp vào terminal để tự động đính kèm hình ảnh hoặc gửi tệp làm ngữ cảnh."
  t207: ".worktreeinclude trong thư mục gốc repo liệt kê các tệp bị Git bỏ qua để sao chép vào worktree."
  t208: "hermes acp chạy Hermes dưới dạng máy chủ ACP để tích hợp với VS Code, Zed và JetBrains."
  t209: "Nhà cung cấp tùy chỉnh: lưu endpoint có tên trong config.yaml, bên dưới custom_providers."
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT chèn prompt hệ thống nhưng không bao giờ lưu vào lịch sử."
  t211: "credential_pool_strategies hỗ trợ các cách luân phiên fill_first, round_robin, least_used và random."
  t212: "hermes auth add nous hoặc hermes auth add openai-codex thiết lập nhà cung cấp dùng OAuth."
  t213: "Máy chủ API hỗ trợ cả Chat Completions và Responses API với trạng thái lưu ở phía máy chủ."
  t214: "đặt tool_preview_length: 0 trong config để hiển thị đầy đủ đường dẫn tệp trong bảng hoạt động của vòng tải."
  t215: "hermes status --deep chạy các bước chẩn đoán chuyên sâu hơn trên tất cả thành phần."
  t216: "Tác vụ định kỳ có thể chạy kèm tập lệnh Python (--script); stdout của tập lệnh sẽ được chèn vào prompt làm ngữ cảnh."
  t217: "Tập lệnh định kỳ nằm trong ~/.hermes/scripts/ và chạy trước agent — rất phù hợp cho quy trình thu thập dữ liệu."
  t218: "prefill_messages_file trong config.yaml chèn ví dụ few-shot vào mọi lệnh gọi API mà không lưu vào lịch sử."
  t219: "SOUL.md thay thế hoàn toàn danh tính mặc định của agent — chỉnh sửa để Hermes mang dấu ấn riêng của bạn."
  t220: "SOUL.md được tự động khởi tạo với tính cách mặc định trong lần chạy đầu. Hãy chỉnh sửa để tùy chỉnh."
  t221: "/compress <focus topic> dành 60–70% ngân sách tóm tắt cho chủ đề bạn chọn và cắt gọn mạnh phần còn lại."
  t222: "Từ lần nén thứ hai trở đi, bộ nén cập nhật bản tóm tắt trước đó thay vì làm lại từ đầu."
  t223: "Trước khi đặt lại phiên gateway, Hermes tự động lưu các thông tin quan trọng vào bộ nhớ ở chế độ nền."
  t224: "thêm network.force_ipv4: true vào config.yaml để xử lý tình trạng treo trên máy chủ có IPv6 lỗi — tùy chọn này vá socket."
  t225: "Công cụ terminal giải thích các mã thoát phổ biến: grep trả về 1 nghĩa là “Không tìm thấy kết quả khớp (không phải lỗi)”."
  t226: "Lệnh terminal chạy ở foreground nếu thất bại sẽ tự động thử lại tối đa 3 lần, với thời gian chờ tăng dần (2s, 4s, 8s)."
  t227: "Các lệnh sudo không kèm tùy chọn sẽ tự chuyển sang đọc SUDO_PASSWORD từ .env — không cần nhập mật khẩu tương tác."
  t228: "các hàm hỗ trợ execute_code cần được import rõ ràng: from hermes_tools import json_parse, shell_quote, retry."
  t229: "7 công cụ sandbox của execute_code (web_search, terminal, read/write/search/patch) dùng RPC — không bao giờ đi vào ngữ cảnh."
  t230: "Đọc cùng một vùng trong tệp từ 3 lần trở lên sẽ hiện cảnh báo. Từ lần thứ 4, thao tác bị chặn hẳn để tránh lặp vô hạn."
  t231: "write_file và patch phát hiện nếu tệp bị chỉnh sửa từ bên ngoài kể từ lần đọc gần nhất, rồi cảnh báo dữ liệu đã cũ."
  t232: "Định dạng patch V4A hỗ trợ các chỉ thị Add File, Delete File và Move File — không chỉ Update."
  t233: "Máy chủ MCP có thể yêu cầu LLM tạo phản hồi thông qua sampling — khi đó agent trở thành công cụ cho máy chủ."
  t234: "Máy chủ MCP gửi notifications/tools/list_changed để tự động đăng ký lại công cụ mà không cần khởi động lại."
  t235: "dùng delegate_task với acp_command: 'claude' để chạy Claude Code dưới dạng agent con trên mọi nền tảng."
  t236: "Cơ chế bàn giao có luồng heartbeat — hoạt động của agent con được truyền lên agent cha, giúp tránh gateway hết thời gian chờ."
  t237: "Khi nhà cung cấp trả về HTTP 402 (yêu cầu thanh toán), client phụ sẽ tự động chuyển sang nhà cung cấp tiếp theo."
  t238: "agent.tool_use_enforcement định hướng các mô hình chỉ mô tả hành động thay vì gọi công cụ — tự động bật cho GPT/Codex."
  t239: "agent.restart_after_turn_timeout cho phép các lượt đang chạy hoàn tất trước khi /restart gọi stop(); restart_drain_timeout chỉ giới hạn thời gian chờ trước khi buộc ngắt sau khi stop() bắt đầu."
  t240: "agent.api_max_retries (mặc định là 3) quy định số lần agent thử lại một lệnh gọi API thất bại trước khi báo lỗi — giảm giá trị này để chuyển phương án dự phòng nhanh hơn."
  t241: "Gateway lưu bộ nhớ đệm các phiên bản AIAgent theo từng phiên — xóa bộ nhớ đệm này sẽ làm hỏng cơ chế lưu bộ nhớ đệm prompt của Anthropic."
  t242: "Mọi trang web đều có thể cung cấp kỹ năng qua /.well-known/skills/index.json — trung tâm kỹ năng sẽ tự động tìm thấy chúng."
  t243: "Nhật ký kiểm tra kỹ năng tại ~/.hermes/skills/.hub/audit.log ghi lại mọi thao tác cài đặt và gỡ bỏ."
  t244: "Các git worktree cũ sẽ tự được dọn khi khởi động: worktree sạch và đã hợp nhất hoàn toàn sẽ bị xóa; nội dung chưa commit hoặc chưa đẩy lên luôn được giữ lại."
  t245: "Hồ sơ phân tách trạng thái Hermes qua HERMES_HOME; các tiến trình con của công cụ trên máy chủ vẫn dùng HOME thật, trừ khi terminal.home_mode là profile."
  t246: "Biến môi trường HERMES_HOME_MODE (dạng bát phân, ví dụ 0701) đặt quyền tùy chỉnh cho thư mục để máy chủ web có thể truy cập."
  t247: "Chế độ container: đặt .container-mode trong HERMES_HOME để CLI trên máy chủ tự chạy bên trong container."
  t248: "Ctrl+C có 5 mức ưu tiên: hủy ghi âm → hủy prompt → hủy bộ chọn → ngắt agent → thoát."
  t249: "Mọi lần ngắt khi agent đang chạy đều được ghi vào ~/.hermes/interrupt_debug.log kèm dấu thời gian."
  t250: "BROWSER_CDP_URL kết nối công cụ trình duyệt với mọi trình duyệt Chromium đang chạy — chấp nhận WebSocket, HTTP hoặc host:port."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true bật khả năng chống phát hiện nâng cao bằng Chromium tùy chỉnh (gói Scale)."
  t252: "CLI tự chuyển sang chế độ gọn khi terminal có chiều rộng dưới 80 cột."
  t253: "Lệnh nhanh hỗ trợ hai loại: exec (chạy trực tiếp lệnh shell) và alias (chuyển hướng sang lệnh khác)."
  t254: "Mô hình ủy quyền theo tác vụ: delegation.model và delegation.provider trong config định tuyến agent con đến các mô hình tiết kiệm hơn."
  t255: "delegation.reasoning_effort điều chỉnh riêng mức độ suy luận cho agent con."
  t256: "display.platforms trong config.yaml cho phép tùy chỉnh cách hiển thị trên từng nền tảng: {telegram: {tool_progress: all}}."
  t257: "human_delay.mode trong config mô phỏng tốc độ gõ của người thật — có thể cấu hình khoảng min_ms/max_ms."
  t258: "Hermes tự động di chuyển phiên bản config khi tải — các khóa config mới xuất hiện mà không cần thao tác thủ công."
  t259: "Các mô hình GPT và Codex có hướng dẫn riêng trong system prompt về cách dùng công cụ đúng nguyên tắc và bắt buộc dùng công cụ."
  t260: "Các mô hình Gemini có chỉ dẫn riêng về đường dẫn tuyệt đối, gọi công cụ song song và lệnh không cần tương tác."
  t261: "có thể đặt context.engine trong config.yaml thành tên plugin để dùng chiến lược quản lý ngữ cảnh khác."
  t262: "Ảnh chụp trang trình duyệt dài hơn 15.000 ký tự sẽ bị cắt bớt hoặc tự động tóm tắt; bản đầy đủ được lưu vào cache/web để phân trang bằng read_file."
  t263: "Bộ nén chạy bước xử lý sơ bộ tiết kiệm chi phí: đầu ra công cụ dài hơn 200 ký tự được thay bằng phần giữ chỗ trước khi LLM chạy."
  t264: "Khi nén thất bại, các lần thử tiếp theo sẽ tạm dừng 10 phút để tránh gửi yêu cầu dồn dập đến API."
  t265: "Lệnh nguy hiểm dài hơn 70 ký tự sẽ có tùy chọn 'view' trong lời nhắc phê duyệt để xem toàn bộ lệnh trước."
  t266: "Khi ghi âm giọng nói, biểu đồ mức âm thanh hiển thị các thanh ▁▂▃▄▅▆▇ dựa trên mức RMS của microphone."
  t267: "Tên hồ sơ không được trùng với tệp thực thi có trong PATH — lệnh 'hermes profile create ls' sẽ bị từ chối."
  t268: "hermes profile create backup --clone-all sao chép toàn bộ (config, khóa, SOUL.md, bộ nhớ, kỹ năng, phiên)."
  t269: "Có thể cấu hình phím ghi âm giọng nói bằng voice.record_key trong config.yaml — không chỉ giới hạn ở Ctrl+B."
  t270: ".cursorrules và các tệp .cursor/rules/*.mdc được tự động phát hiện và tải làm ngữ cảnh dự án."
  t271: "Tệp ngữ cảnh hỗ trợ phát hiện hơn 10 kiểu prompt injection — Unicode ẩn, câu “ignore instructions”, nỗ lực đánh cắp dữ liệu."
  t272: "GPT-5 và Codex dùng vai trò 'developer' thay cho 'system' trong định dạng tin nhắn."
  t273: "Có thể đặt cấu hình phụ riêng cho từng tác vụ: auxiliary.vision.provider, auxiliary.compression.model, v.v. trong config.yaml."
  t274: "Auxiliary client xem 'main' là bí danh nhà cung cấp — bí danh này trỏ đến nhà cung cấp và mô hình chính thực tế của bạn."
  t275: "hermes claw migrate --dry-run xem trước quá trình di chuyển OpenClaw mà không ghi bất cứ thứ gì."
  t276: "Đường dẫn tệp được dán kèm dấu nháy hoặc dấu cách đã escape sẽ được xử lý tự động — không cần chỉnh sửa thủ công."
  t277: "Lệnh slash không bao giờ bị thu gọn khi dán nội dung dài — /command vẫn hoạt động đúng với đối số dài."
  t278: "Ở chế độ ngắt, lệnh slash được nhập khi agent đang chạy sẽ bỏ qua logic ngắt và chạy ngay."
  t279: "HERMES_DEV=1 bỏ qua bước phát hiện chế độ container khi phát triển cục bộ."
  t280: "Mỗi máy chủ MCP có bộ công cụ riêng (mcp-servername), có thể bật/tắt độc lập bằng hermes tools."
  t281: "Các phần giữ chỗ ${ENV_VAR} trong config MCP được thay bằng giá trị thực khi khởi chạy máy chủ — bao gồm cả biến trong ~/.hermes/.env."
  t282: "Kỹ năng từ kho mã đáng tin cậy (NousResearch) được gán mức bảo mật 'trusted'; kỹ năng cộng đồng sẽ được quét kỹ hơn."
  t283: "Khu cách ly kỹ năng tại ~/.hermes/skills/.hub/quarantine/ lưu các kỹ năng đang chờ xem xét bảo mật."
  t284: "/steer <prompt> chèn ghi chú sau lần gọi công cụ tiếp theo — điều chỉnh hướng xử lý giữa tác vụ mà không làm gián đoạn."
  t285: "/goal <text> đặt mục tiêu cố định cho vòng lặp Ralph — Hermes tự tiếp tục hết lượt này đến lượt khác cho đến khi bộ đánh giá xác nhận đã xong."
  t286: "/snapshot create [label] lưu ảnh chụp toàn bộ trạng thái cấu hình Hermes; dùng /snapshot restore <id> để khôi phục sau này."
  t287: "/copy [N] sao chép phản hồi gần nhất của assistant vào clipboard; thêm số để sao chép phản hồi thứ N tính từ cuối."
  t288: "/redraw buộc giao diện vẽ lại toàn bộ, khắc phục tình trạng hiển thị lệch trong terminal sau khi đổi kích thước tmux hoặc chọn bằng chuột."
  t289: "/agents (bí danh /tasks) hiển thị các agent đang hoạt động và tác vụ chạy nền trong phiên hiện tại."
  t290: "/footer bật/tắt phần chân trang gateway trong phản hồi cuối, hiển thị mô hình, % ngữ cảnh và thư mục làm việc hiện tại."
  t291: "/busy queue|steer|interrupt chọn việc nhấn Enter sẽ làm gì khi Hermes đang xử lý."
  t292: "/topic trong tin nhắn riêng Telegram bật chế độ chủ đề nhiều phiên do người dùng quản lý — dùng /topic <id> để mở lại phiên cũ ngay trong cuộc trò chuyện."
  t293: "/approve session|always chạy lệnh nguy hiểm đang chờ phê duyệt với phạm vi tin cậy bạn chọn; /deny từ chối lệnh đó."
  t294: "/restart khởi động lại gateway an toàn sau khi các lượt đang chạy hoàn tất, rồi báo cho người yêu cầu khi gateway hoạt động trở lại."
  t295: "/kanban boards switch <slug> đổi bảng Kanban nhiều dự án đang dùng ngay trong cuộc trò chuyện."
  t296: "/reload nạp lại ~/.hermes/.env vào phiên đang chạy — dùng khóa API mới mà không cần khởi động lại."
  t297: "cronjob với no_agent=True chạy script theo lịch và gửi thẳng stdout — không tốn token, không cần LLM."
  t298: "Nếu stdout của script cron trống, tác vụ sẽ chạy âm thầm — không gửi gì cả, rất phù hợp cho watchdog theo dõi ngưỡng."
  t299: "HERMES_CRON_MAX_PARALLEL (mặc định 4) giới hạn số tác vụ cron chạy mỗi lượt để tránh các đợt chạy dồn làm quá tải khóa API."
  t300: "Hook của gateway nằm trong ~/.hermes/hooks/<name>/ cùng HOOK.yaml + handler.py — hàm xử lý phải có tên `handle`."
  t301: "Sự kiện hook gồm gateway:startup, session:start, agent:step và đăng ký nhận sự kiện dạng ký tự đại diện command:*."
  t302: "Tạo checklist ~/.hermes/BOOT.md, rồi hook gateway:startup sẽ chạy checklist đó dưới dạng agent dùng một lần mỗi khi khởi động."
  t303: "hermes curator run --dry-run xem trước những gì curator sẽ lưu trữ hoặc gộp lại mà không thay đổi dữ liệu."
  t304: "hermes curator pin <skill> khóa kỹ năng để ngăn cả việc tự động lưu trữ lẫn công cụ skill_manage của agent tác động đến kỹ năng đó."
  t305: "hermes curator rollback khôi phục kỹ năng từ ảnh chụp trước khi chạy — bản sao lưu nằm trong skills/.curator_backups/."
  t306: "hermes auth reset <provider> [target] xóa thời gian chờ và cờ hết hạn trên toàn bộ nhóm thông tin xác thực hoặc một thông tin xác thực được chỉ định bằng chỉ mục, id hay nhãn."
  t307: "credential_pool_strategies.<provider>: round_robin luân phiên đều các khóa thay vì dùng mặc định fill_first."
  t308: "bật use_gateway: true cho từng công cụ để định tuyến web, image, tts hoặc browser qua gói đăng ký Nous — không cần thêm khóa."
  t309: "provider_routing.data_collection: deny loại các nhà cung cấp lưu trữ dữ liệu khỏi OpenRouter."
  t310: "provider_routing.require_parameters: true chỉ định tuyến đến nhà cung cấp hỗ trợ mọi tham số trong yêu cầu của bạn."
  t311: "HERMES_TUI_RESUME=1 tự kết nối lại phiên TUI gần nhất khi khởi chạy — hữu ích khi kết nối SSH bị ngắt."
  t312: "HERMES_TUI_THEME=light|dark|<hex> buộc dùng chủ đề TUI trên các terminal không đặt COLORFGBG."
  t313: "Nhấn Ctrl+G hoặc Ctrl+X Ctrl+E trong TUI để mở vùng nhập liệu bằng $EDITOR, tiện soạn prompt dài nhiều dòng."
  t314: "TUI hiển thị LaTeX trực tiếp — $E=mc^2$ sẽ thành công thức toán Unicode thay vì TeX thô."
  t315: "hermes dashboard mở giao diện web cục bộ tại 127.0.0.1:9119 — dữ liệu không rời khỏi localhost."
  t316: "hermes dashboard nhúng toàn bộ Hermes TUI vào trình duyệt bằng xterm.js và PTY qua WebSocket."
  t317: "Thả một tệp YAML có hai màu bảng màu vào ~/.hermes/dashboard-themes/ để đổi giao diện toàn bộ dashboard."
  t318: "Plugin dashboard chỉ cần thả manifest.json + gói JS vào ~/.hermes/dashboard-plugins/ — không cần build bằng npm."
  t319: "thêm layoutVariant: cockpit vào chủ đề dashboard để có thanh bên trái rộng 260px; plugin có thể thêm nội dung qua sidebar slot."
  t320: "đặt display.tool_progress_command: true để bật /verbose trên các nền tảng nhắn tin; mặc định, lệnh này chỉ dùng được trong CLI."
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result chỉ gửi thông báo khi tác vụ chạy nền hoàn tất (khác với concise/all/error/off)."
  t322: "HERMES_WRITE_SAFE_ROOT giới hạn write_file/patch trong các tiền tố thư mục; phân tách nhiều đường dẫn bằng os.pathsep (: hoặc ;)."
  t323: "HERMES_IGNORE_RULES bỏ qua việc tự động nạp AGENTS.md, SOUL.md, .cursorrules, bộ nhớ và kỹ năng tải sẵn."
  t324: "HERMES_ACCEPT_HOOKS tự động phê duyệt các shell hook chưa từng thấy được khai báo trong config.yaml mà không cần lời nhắc trên TTY."
  t325: "auxiliary.goal_judge.model chuyển phần đánh giá /goal sang một mô hình nhanh, giá rẻ để chi phí vòng lặp gần như bằng 0."
  t326: "Checkpoint bỏ qua các thư mục có hơn 50.000 tệp để tránh thao tác Git chậm trên các monorepo khổng lồ."
  t327: "tts.provider: piper chạy TTS cục bộ bằng CPU, hỗ trợ 44 ngôn ngữ — giọng đọc tự tải xuống ~/.hermes/cache/piper-voices/."
  t328: "tts.providers.<name>.type: command kết nối bất kỳ công cụ TTS CLI nào bằng các placeholder {input_path} và {output_path}."
  t329: "API_SERVER_ENABLED=true chạy endpoint tương thích OpenAI bên cạnh gateway để dùng với Open WebUI và LibreChat."
  t330: "GATEWAY_PROXY_URL thiết lập mô hình phân tách: xử lý I/O của nền tảng cục bộ, còn công việc của agent được chuyển cho API server từ xa."
  t331: "MATRIX_DEVICE_ID cố định ID thiết bị để dùng E2EE — nếu không có, khóa sẽ thay đổi sau mỗi lần khởi động và không thể giải mã tin nhắn cũ."
  t332: "Phải đặt TELEGRAM_WEBHOOK_SECRET khi đã đặt TELEGRAM_WEBHOOK_URL — tạo bằng openssl rand -hex 32."
  t333: "batch_runner.py --resume đối chiếu nội dung prompt đã hoàn tất theo văn bản, nên việc sắp xếp lại tập dữ liệu không khiến công việc đã xong chạy lại."
  t334: "/new bắt đầu phiên mới ngay tại chỗ (bí danh /reset) — ID phiên mới, lịch sử sạch, CLI vẫn mở."
  t335: "/clear xóa nội dung màn hình terminal VÀ bắt đầu phiên mới — một phím tắt để làm mới giao diện."
  t336: "/history in cuộc trò chuyện hiện tại ngay trong CLI — tiện để xem lại nhanh mà không cần thoát."
  t337: "/save lưu cuộc trò chuyện hiện tại vào ổ đĩa mà không kết thúc phiên."
  t338: "/status hiển thị nhanh thông tin phiên: ID, tiêu đề, mô hình, mức sử dụng token và thời gian đã chạy."
  t339: "/image <path> đính kèm tệp ảnh cục bộ vào prompt tiếp theo mà không cần dán hay kéo thả."
  t340: "/platforms hiển thị trạng thái kết nối gateway và các nền tảng nhắn tin ngay trong cuộc trò chuyện."
  t341: "/commands hiển thị lần lượt toàn bộ danh sách lệnh gạch chéo và kỹ năng đã cài đặt — tiện dùng trên các nền tảng không hỗ trợ tự động hoàn thành bằng Tab."
  t342: "/toolsets liệt kê mọi bộ công cụ hiện có để bạn biết -t/--toolsets chấp nhận những gì."
  t343: "/voice tts bật chế độ chỉ TTS — agent đọc phản hồi thành tiếng, còn bạn vẫn nhập prompt bằng bàn phím."
  t344: "/reload-skills quét lại ~/.hermes/skills/ để nhận kỹ năng mới thêm mà không cần khởi động lại phiên."
  t345: "/indicator kaomoji|emoji|unicode|ascii chọn kiểu chỉ báo bận trong TUI khi agent đang chạy."
  t346: "/debug tải lên gói hỗ trợ (thông tin hệ thống + nhật ký) và trả về các liên kết có thể chia sẻ — dùng được cả trong cuộc trò chuyện."
  t347: "hermes -z \"<prompt>\" là cách chạy một lượt gọn nhất: chỉ in câu trả lời cuối cùng ra stdout, không có gì khác — lý tưởng để nối lệnh trong script."
  t348: "hermes chat --pass-session-id chèn ID phiên vào system prompt để agent có thể tự nhắc đến phiên đó."
  t349: "hermes chat --image path/to/pic.png đính kèm ảnh cục bộ vào một truy vấn -q mà không cần tải ảnh lên riêng."
  t350: "hermes chat --ignore-user-config bỏ qua cấu hình người dùng đang hoạt động — tiện để tạo báo cáo lỗi có thể tái hiện và chạy CI."
  t351: "hermes chat --source tool gắn nhãn cho các cuộc trò chuyện do chương trình tạo để chúng không làm rối danh sách hermes sessions."
  t352: "hermes dump --show-keys hiển thị dấu vân tay đã che của khóa API để hỗ trợ gỡ lỗi chuyên sâu."
  t353: "hermes sessions rename <ID> \"new title\" đổi tên bất kỳ phiên nào trước đây; hermes sessions delete <ID> xóa một phiên."
  t354: "hermes import khôi phục bản sao lưu Hermes đầy đủ dạng zip; có thể nhập bản xuất session JSON/JSONL từ trang Sessions trên bảng điều khiển."
  t355: "hermes fallback cho phép quản lý tương tác chuỗi fallback_model — không cần tự sửa config.yaml."
  t356: "hermes pairing thay token ghép đôi DM — người đầu tiên nhắn tin sau khi token được thay sẽ giành quyền truy cập bot."
  t357: "hermes setup hướng dẫn người dùng mới thiết lập nhà cung cấp, khóa và nền tảng trong một quy trình tương tác."
  t358: "hermes status --deep kiểm tra toàn diện tình trạng của mọi thành phần; hermes status thông thường chỉ hiển thị nhanh."
  t359: "HERMES_AGENT_TIMEOUT=0 tắt cơ chế gateway dừng agent đang chạy khi không hoạt động — hữu ích cho các phiên nghiên cứu dài."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 tự tải plugin trong kho mã từ ./.hermes/plugins/ — thiết kế có kiểm soát quyền tin cậy."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 tắt cảnh báo 'file changed since you read it' khi dùng patch và write_file."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true cho phép công cụ web truy cập localhost và mạng riêng — mặc định tắt ở chế độ gateway."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 tự cài đặt các kỹ năng tùy chọn từ danh mục trong lần chạy đầu tiên của mỗi hồ sơ."
  t364: "HERMES_BUNDLED_SKILLS trỏ đến thư mục kỹ năng đóng gói tùy chỉnh — dùng trong các gói Homebrew và Nix."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 xuất payload của mọi yêu cầu API ra stdout thay vì tệp nhật ký."
  t366: "HERMES_OAUTH_TRACE=1 ghi nhật ký các lần trao đổi và làm mới token OAuth đã che thông tin để gỡ lỗi xác thực nhà cung cấp."
  t367: "HERMES_STREAM_RETRIES (mặc định là 3) quy định số lần thử kết nối lại giữa luồng khi gặp lỗi mạng tạm thời."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false tắt tin nhắn xác nhận ⚡/⏳/⏩ khi người dùng nhắn cho agent đang bận."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (mặc định là 180s) quy định tần suất gateway gửi cập nhật tiến độ trong các lượt xử lý dài."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (mặc định là 900s) giới hạn thời gian /restart chờ các lượt đang chạy hoàn tất trước khi buộc khởi động lại."
  t371: "HERMES_CHECKPOINT_TIMEOUT (mặc định là 30s) giới hạn thời gian tạo checkpoint hệ thống tệp — tăng giá trị này với kho mã đơn khối lớn."
  t372: "image_gen.model trong config.yaml chọn mô hình FAL: flux-2/klein, gpt-image-2, nano-banana-pro và nhiều mô hình khác."
  t373: "image_gen.provider định tuyến việc tạo ảnh qua plugin (OpenAI Images, Codex, FAL) thay vì dùng mặc định."
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY định tuyến phân tích hình ảnh đến bất kỳ endpoint nào tương thích với OpenAI."
  t375: "API_SERVER_MODEL_NAME tùy chỉnh tên mô hình trên /v1/models — cần thiết khi thiết lập Open WebUI với nhiều hồ sơ."
  t376: "Plugin bảng điều khiển được phục vụ từ /dashboard-plugins/<name>/ — thả tệp vào ~/.hermes/dashboard-plugins/."
  t377: "Các cuộc trò chuyện --source tool mặc định không xuất hiện trong danh sách hermes sessions — hãy đặt --source rõ ràng để xem chúng."
  placeholder:
    p01: "Hỏi bất cứ điều gì hoặc nhập / để xem lệnh…"
    p02: "Tóm tắt nội dung trong thư mục này"
    p03: "Soạn phản hồi cho email mới nhất trong hộp thư đến"
    p04: "Lên kế hoạch cho một tính năng rồi xây dựng từng bước"
    p05: "Tìm và sửa bài kiểm thử đang thất bại"
    p06: "Nghiên cứu chủ đề này và viết bản tóm tắt cho tôi"
    p07: "Gần đây kho mã này có gì thay đổi?"
    p08: "Chuyển các ghi chú này thành danh sách việc cần làm"
    p09: "Giải thích lỗi này và cách khắc phục"
    p10: "Đặt lời nhắc hoặc lên lịch tác vụ định kỳ"
    p11: "Nhập / để xem lệnh hoặc nhấn Ctrl+P để mở bảng lệnh"
