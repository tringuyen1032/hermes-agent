userMessages.rpc.notConnected: "Hermes hiện không kết nối nên tin nhắn chưa được gửi. Hermes sẽ tự động kết nối lại; hãy chờ một lát rồi thử lại, hoặc nhập /logs nếu tình trạng này vẫn tiếp diễn."
userMessages.rpc.sessionNotFound: "Cuộc trò chuyện này không còn kết nối với backend (phiên đã rảnh hoặc backend đã khởi động lại). Lịch sử vẫn được lưu: nhập /resume để mở lại."
userMessages.rpc.slashCrashed: "/{0} chưa hoàn tất: công cụ hỗ trợ lệnh đã gặp sự cố. Hãy thử lại; nhập /logs để xem dấu vết lỗi."
